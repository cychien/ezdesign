name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - src/brand.ts
      - src/brand-wordmark.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The desktop workspace's Electron binary; the website never runs it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter ezdesign-website run check
      - run: pnpm --filter ezdesign-website run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
