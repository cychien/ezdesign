<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Frame $N</title>
<style>
  body { margin: 0; font-family: -apple-system, 'Noto Sans TC', sans-serif; background: hsl(calc($N * 9), 60%, 97%); }
  header { padding: 18px; font-weight: 600; border-bottom: 1px solid #0001; }
  .row { margin: 12px 18px; padding: 16px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px #0001; }
  h2 { margin: 24px 18px 8px; font-size: 26px; }
</style>
</head>
<body>
<header>方向 $N</header>
<h2>第 $N 個版本</h2>
<div class="row">卡片一：週報自動完成</div>
<div class="row">卡片二：風險自己浮出來</div>
<div class="row">卡片三：寫給人看的摘要</div>
<div class="row">卡片四：一鍵分享給主管</div>
<div class="row">卡片五：不用開會對狀態</div>
</body>
</html>
