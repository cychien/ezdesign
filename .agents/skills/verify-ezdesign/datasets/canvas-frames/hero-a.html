<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: -apple-system, 'Noto Sans TC', sans-serif; color: #111; }
  .hero { padding: 72px 64px 40px; background: linear-gradient(180deg, #f5f3ff, #fff); }
  .cards { display: flex; gap: 20px; padding: 24px 64px 64px; }
  .card { flex: 1; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; }
</style>
</head>
<body>
<section class="hero">
<h1>大標題</h1>
<p>讓進度自己浮出來，不用開會寫週報。</p>
<button>免費試用</button>
</section>
<!-- 三個方向的卡片 -->
<div class="cards">
<div class="card">
<h3>自動收斂</h3>
<p>從 GitHub、Linear 與 Slack 收斂進度。</p>
</div>
<div class="card">
<h3>寫給人看</h3>
<p>每則摘要都有一句話結論。</p>
</div>
<div class="card">
<h3>風險浮現</h3>
<p>卡住的項目自動標記。</p>
</div>
</div>
</body>
</html>
