name = "ezdesign-account"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = false

[env.production]
name = "ezdesign-account-production"
routes = [{ pattern = "account.ezdesign.dev", custom_domain = true }]

[env.production.vars]
GOOGLE_CLIENT_ID = "REPLACE_WITH_GOOGLE_CLIENT_ID"

[[env.production.d1_databases]]
binding = "DB"
database_name = "account"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[vars]
GOOGLE_CLIENT_ID = "local"

[[d1_databases]]
binding = "DB"
database_name = "account-local"
database_id = "local"
migrations_dir = "migrations"

[[ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
