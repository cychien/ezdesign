appId: dev.ezdesign.app
productName: ezdesign
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: stage/ezdesign
    to: ezdesign
  # A folder named node_modules is skipped unless it is the source itself.
  - from: stage/ezdesign/node_modules
    to: ezdesign/node_modules
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # What electron-updater downloads.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: ezdesign-${arch}.dmg
electronFuses:
  runAsNode: true
  # Its key would live in the login keychain, readable only by the copy that
  # wrote it; an ad-hoc signature changes with every build, so each update
  # would ask for the keychain password again. The cookies are the local apps'.
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: cychien
  repo: ezdesign
  # The workflow opens the draft first and publishes it once every file is in.
  releaseType: draft
  tagNamePrefix: desktop-v
